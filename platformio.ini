; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
	adafruit/Adafruit GFX Library@^1.11.3
	adafruit/Adafruit SSD1351 library@^1.2.8
	bblanchon/ArduinoJson@^7.2.0
	adafruit/Adafruit NeoPixel@^1.12.3
monitor_speed = 921600
; App slots for wireless updates + a separate partition holding the eye graphics.
board_build.partitions = partitions_creeper.csv
; Also writes eyedata/eyes.bin to the 'eyes' partition on every USB upload.
extra_scripts =
	pre:tools/pio_version.py
	post:tools/pio_eyes.py
